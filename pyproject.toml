[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlproject"
version = "0.1.0"
description = "Utilities for reading SAS files into PySpark, plus an AWS certification progress agent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.5",
  "pyspark>=3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
aws-cert = "aws_cert_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
