[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlproject"
version = "0.1.0"
description = "Utilities for reading SAS files into PySpark."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyspark>=3.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
