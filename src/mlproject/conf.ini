# Sample pipeline configuration in INI format.
#
# This works if you want to stay close to a simple "conf.ini" style.
# For more complex pipelines with many joins and nested options, YAML is a
# better fit. See: src/mlproject/conf.sample.yaml
#
# Conventions used below:
# - One section per input source: [source:<name>]
# - Only one source should have basefile = true
# - joinkey can be a single column or a comma-separated list
# - joincondition can be: inner, left, right, full
# - union = true means the file path may match multiple SAS files and those
#   files should be unioned before join logic is applied

[pipeline]
name = sample_sas_pipeline
base_source = abc

[source:abc]
file = /nas/test/abc.sas
metadata = /nas/test/abc.metadata
joinkey =
joincondition =
basefile = true
union = false

[source:ebf]
file = /nas/test/ebf.sas
metadata = /nas/test/ebf.metadata
joinkey = acct_id
joincondition = inner
basefile = false
union = false

[source:kb]
file = /nas/test/kb*.sas
metadata = /nas/test/kd.metadata
joinkey = acct_id
joincondition = inner
basefile = false
union = true
