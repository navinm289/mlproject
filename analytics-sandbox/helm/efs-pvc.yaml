# EFS-backed per-user home storage (rendered by install.sh via envsubst).
# Requires the EFS CSI driver installed on the cluster.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sandbox-home-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "${EFS_FILE_SYSTEM_ID}:/analytics-sandbox/homes"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-home
  namespace: analytics-sandbox
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
  volumeName: sandbox-home-pv
