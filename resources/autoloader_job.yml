resources:
  jobs:
    autoloader_bronze:
      name: autoloader-bronze-control-validation
      trigger:
        file_arrival:
          url: ${var.landing_path}
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 120
      tasks:
        - task_key: ingest_and_validate_bronze
          max_retries: 2
          spark_python_task:
            python_file: ../src/mlproject/autoloader_bronze.py
            parameters:
              - --landing-path
              - ${var.landing_path}
              - --checkpoint-path
              - ${var.checkpoint_path}
              - --schema-path
              - ${var.schema_path}
              - --bronze-table
              - ${var.bronze_table}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
