<text x="46" y="662" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#1b345c">CONFIGURATION &amp; POLICY</text>
<text x="332" y="662" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#687b93">These are controls, not additional network hops.</text>
<rect x="42" y="680" width="341" height="111" rx="14" fill="#e9f3ff" stroke="#aacaf0" stroke-width="1.6"/>
<text x="58" y="708" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#263a59">TEMPLATE A  ·  SOURCE IPS</text>
<text x="58" y="741" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#2f4664">Five edge node addresses</text>
<text x="58" y="767" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#65768f">10.20.1.11–10.20.1.15 (example)</text>
<rect x="397" y="680" width="337" height="111" rx="14" fill="#e9f3ff" stroke="#aacaf0" stroke-width="1.6"/>
<text x="413" y="708" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#263a59">TEMPLATE B  ·  DESTINATION IPS</text>
<text x="413" y="741" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#2f4664">S3 endpoint ENI addresses</text>
<text x="413" y="767" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#65768f">10.100.2.50 / 10.100.3.50 (example)</text>
<rect x="748" y="680" width="333" height="111" rx="14" fill="#fff4e7" stroke="#ecc291" stroke-width="1.6"/>
<text x="764" y="708" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#263a59">CORPORATE FIREWALL REQUEST</text>
<text x="764" y="741" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#2f4664">Template A → Template B</text>
<text x="764" y="767" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#65768f">TCP 443, approved direction</text>
<rect x="1095" y="680" width="464" height="111" rx="14" fill="#eef9f2" stroke="#afd9b7" stroke-width="1.6"/>
<text x="1111" y="708" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#263a59">AWS ENDPOINT SECURITY GROUP</text>
<text x="1111" y="741" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#2f4664">Allow inbound TCP 443 from approved sources</text>
<text x="1111" y="767" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#65768f">Check the actual source IP if NAT is used</text>
<rect x="43" y="815" width="741" height="87" rx="14" fill="#ffffff" stroke="#d6e1ee" stroke-width="1.3"/>
<rect x="799" y="815" width="760" height="87" rx="14" fill="#ffffff" stroke="#d6e1ee" stroke-width="1.3"/>
<text x="61" y="842" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#1c5fa3">DNS / ROUTING</text>
<text x="61" y="865" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#314760">Use endpoint-specific DNS, or private DNS + inbound Resolver.</text>
<text x="61" y="887" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#314760">Route endpoint private IPs over Direct Connect or VPN.</text>
<text x="819" y="842" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#19814e">AUTHORIZATION</text>
<text x="819" y="865" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#314760">IAM + endpoint policy + S3 bucket policy (+ KMS if applicable).</text>
<text x="819" y="887" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#314760">Open port 443 does NOT grant access to S3 objects.</text>
</svg>