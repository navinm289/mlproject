bundle:
  name: lakeflow-customer-gold
variables:
  catalog:
    description: REPLACE with an existing Unity Catalog catalog
  source_schema:
    default: customer_source_dev
  gold_schema:
    default: customer_gold_dev
  run_id:
    description: Required immutable logical batch ID; reuse for retry
  as_of:
    description: Required UTC cutoff, e.g. 2026-09-01 00:00:00
  max_quarantine_pct:
    default: "5"
  baseline_posted_rows:
    description: Approved historical median for this source scope; use 4 for sample
    default: "4"
resources:
  pipelines:
    customer_gold:
      name: customer-gold-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.gold_schema}
      serverless: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      libraries:
        - file:
            path: ./src/pipeline.py
      configuration:
        gold.source: ${var.catalog}.${var.source_schema}
        gold.run_id: ${var.run_id}
        gold.as_of: ${var.as_of}
        gold.max_quarantine_pct: ${var.max_quarantine_pct}
        gold.max_email_null_pct: "20"
        gold.min_posted_rows: "1"
        gold.baseline_posted_rows: ${var.baseline_posted_rows}
        gold.min_volume_ratio: "0.5"
        gold.max_volume_ratio: "2.0"
        gold.freshness_days: "30"
        spark.sql.session.timeZone: UTC
  jobs:
    refresh_gold:
      name: refresh-customer-gold-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: refresh
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_gold.id}
            full_refresh: false
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
      # Add email_notifications/webhook_notifications with real on-call destinations.
targets:
  dev:
    default: true
    mode: development
  test:
    variables:
      source_schema: customer_source_test
      gold_schema: customer_gold_test
  prod:
    mode: production
    variables:
      source_schema: customer_source_prod
      gold_schema: customer_gold_prod
    # REPLACE: set workspace.host and run_as.service_principal_name in deployment environment.
