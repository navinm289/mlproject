# Base Z2JH values shared by ALL teams and environments.
# This file is static (no placeholders). Team + env specifics come from:
#   envs/<env>.yaml   (rendered by install.sh via envsubst)
#   teams/<team>.yaml (rendered by install.sh via envsubst)
#
# Do NOT put hostnames, OIDC secrets, S3 buckets, or team groups here.

fullnameOverride: jupyterhub

hub:
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: generic-oauth
    GenericOAuthenticator:
      # Static claim mapping; issuer URLs + client creds come from envs/<env>.yaml,
      # allowed_groups/admin_groups come from teams/<team>.yaml.
      username_claim: email
      claim_groups_key: groups
      scope:
        - openid
        - email
        - profile
    KubeSpawner:
      start_timeout: 600
      http_timeout: 120

  service:
    type: ClusterIP

proxy:
  service:
    type: ClusterIP
  chp:
    networkPolicy:
      enabled: true

singleuser:
  defaultUrl: /lab
  # Same SA name in every team namespace; each namespace's SA is annotated
  # with that team's IRSA role (see rbac/singleuser-sa.tmpl.yaml).
  serviceAccountName: jupyterhub-singleuser
  cloudMetadata:
    blockWithIptables: false

  memory:
    guarantee: 2G
    limit: 4G
  cpu:
    guarantee: 0.5
    limit: 2

  profileList:
    - display_name: "Light - PySpark + HMS (read)"
      description: "Small driver; Iceberg read via HMS"
      default: true
      kubespawner_override:
        memory_guarantee: 2G
        memory_limit: 4G
        cpu_guarantee: 0.5
        cpu_limit: 2
        environment:
          SCRATCHBOOK_PROFILE: light
          SPARK_CONF_DIR: /opt/spark/conf
    - display_name: "Standard - more RAM"
      description: "Larger single-user pod for heavier local analytics"
      kubespawner_override:
        memory_guarantee: 4G
        memory_limit: 8G
        cpu_guarantee: 1
        cpu_limit: 4
        environment:
          SCRATCHBOOK_PROFILE: standard
          SPARK_CONF_DIR: /opt/spark/conf
    - display_name: "Heavy - Spark-on-K8s submit"
      description: "Submit larger jobs; still uses HMS + S3 Iceberg"
      kubespawner_override:
        memory_guarantee: 4G
        memory_limit: 8G
        cpu_guarantee: 1
        cpu_limit: 4
        environment:
          SCRATCHBOOK_PROFILE: heavy
          SPARK_CONF_DIR: /opt/spark/conf
          SPARK_ON_K8S: "true"

  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/bash
          - -c
          - |
            mkdir -p "${HOME}/notebooks"
            if [[ ! -f "${HOME}/.scratchbook_initialized" ]]; then
              cp -n /opt/scratchbook/spark-defaults.conf.template "${HOME}/.spark-defaults.conf" 2>/dev/null || true
              touch "${HOME}/.scratchbook_initialized"
            fi

  networkPolicy:
    enabled: true
    egressAllowRules:
      privateIPs: true
      nonPrivateIPs: true

cull:
  enabled: true
  timeout: 3600
  every: 300
  users: false
  removeNamedServers: false
  maxAge: 0

scheduling:
  userScheduler:
    enabled: true

prePuller:
  hook:
    enabled: true
  continuous:
    enabled: false
