# PROD environment overlay (rendered by install.sh via envsubst).
# Values are sourced from config/prod.env.
# Prod tightens idle culling and disables admin_access to reduce blast radius.

hub:
  config:
    JupyterHub:
      admin_access: false
    GenericOAuthenticator:
      client_id: "${OIDC_CLIENT_ID}"
      client_secret: "${OIDC_CLIENT_SECRET}"
      oauth_callback_url: "https://${HOST}/hub/oauth_callback"
      authorize_url: "https://${OIDC_ISSUER}/oauth2/authorize"
      token_url: "https://${OIDC_ISSUER}/oauth2/token"
      userdata_url: "https://${OIDC_ISSUER}/oauth2/userInfo"
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::${ACCOUNT_ID}:role/jhub-${TEAM}-hub"

singleuser:
  image:
    name: "${ECR_REPO}/scratchbook-notebook"
    tag: "${IMAGE_TAG}"
  extraEnv:
    HMS_THRIFT_URI: "${HMS_THRIFT_URI}"
    ICEBERG_WAREHOUSE: "s3://${LAKE_BUCKET}/warehouse/"
    S3_SCRATCH_PREFIX: "s3://${LAKE_BUCKET}/scratch/${TEAM}/"
    S3_CURATED_PREFIX: "s3://${LAKE_BUCKET}/curated/${TEAM}/"
    AWS_REGION: "${REGION}"
    AWS_DEFAULT_REGION: "${REGION}"
    TEAM: "${TEAM}"
    ENVIRONMENT: "${ENVIRONMENT}"

# Prod: cull idle notebooks faster to control cost/footprint
cull:
  enabled: true
  timeout: 1800
  every: 300

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - "${HOST}"
  tls:
    - hosts:
        - "${HOST}"
