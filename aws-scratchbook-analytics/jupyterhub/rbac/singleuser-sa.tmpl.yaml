# Per-team namespace + IRSA ServiceAccount + HMS NetworkPolicy
# (rendered by install.sh via envsubst, then kubectl apply).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    kubernetes.io/metadata.name: ${NAMESPACE}
    team: ${TEAM}
    app.kubernetes.io/part-of: scratchbook-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub-singleuser
  namespace: ${NAMESPACE}
  annotations:
    # Team-scoped IAM role: read curated/<team> + warehouse, write scratch/<team>/<user>
    eks.amazonaws.com/role-arn: "arn:aws:iam::${ACCOUNT_ID}:role/jhub-${TEAM}-singleuser"
---
# Allow only THIS team's namespace to reach the shared HMS service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-${TEAM}-to-hms
  namespace: ${HMS_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: hive-metastore
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${NAMESPACE}
      ports:
        - protocol: TCP
          port: 9083
