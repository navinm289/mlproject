# Team overlay: brands (rendered by install.sh via envsubst).
# Controls who can log in (OIDC groups) and which shared path is mounted.

hub:
  config:
    GenericOAuthenticator:
      # URL is discovery, not authorization. Only these groups may enter THIS hub.
      allowed_groups:
        - "${TEAM}"
        - "${TEAM}-admins"
        - platform-admins
      admin_groups:
        - "${TEAM}-admins"
        - platform-admins

singleuser:
  storage:
    type: static
    static:
      pvcName: jhub-home
      subPath: "homes/{username}"
    extraVolumes:
      - name: shared-team
        persistentVolumeClaim:
          claimName: jhub-shared
      - name: shared-examples
        persistentVolumeClaim:
          claimName: jhub-shared
    extraVolumeMounts:
      # Team collaboration space (read-write for all team members)
      - name: shared-team
        mountPath: "/shared/${TEAM}"
        subPath: shared
      # Read-only examples seeded by admins
      - name: shared-examples
        mountPath: /shared/examples
        subPath: examples
        readOnly: true
